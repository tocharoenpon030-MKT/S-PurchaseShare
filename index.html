<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>แดชบอร์ดต้นทุนและกำไรหินทราย</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--tx:#1f2937;--mu:#6b7280;--ln:#e5e7eb;--ac:#d97706;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111827;--card:#1f2937;--tx:#f3f4f6;--mu:#9ca3af;--ln:#374151;--ac:#f59e0b;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,'Noto Sans Thai',sans-serif;padding:16px;max-width:1200px;margin:auto}
h1{font-size:20px;margin:0 0 6px}
.mu{color:var(--mu);font-size:13px;margin:0 0 12px}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
a.btn{background:var(--ac);color:#fff;text-decoration:none;padding:9px 16px;border-radius:8px;font-weight:700}
a.data{margin-left:auto;background:#16a34a}
@media (max-width:600px){body{padding:10px}a.btn{flex:1;text-align:center}iframe{height:80vh}}
iframe{width:100%;height:85vh;border:1px solid var(--ln);border-radius:12px;background:var(--card)}
</style>
</head>
<body>
<h1>แดชบอร์ดต้นทุนและกำไรหินทราย</h1>
<p class="mu">ข้อมูลเป็นความลับ — เปิดดูได้เฉพาะบัญชี Google ที่ได้รับสิทธิ์เข้าถึงชีตเท่านั้น</p>
<div class="bar">
  <a class="btn" href="https://script.google.com/macros/s/AKfycbzPZrGOin1o1HVcz9u16AIO8Kgrtj7wzTMTb6gJJ9khD8Ldt6fK1Aq6fcMljg_lHHcI/exec" target="_blank" rel="noopener">เปิดแดชบอร์ด (แท็บใหม่)</a>
  <a class="btn data" href="https://docs.google.com/spreadsheets/d/1NRcslhSAtKtuFfSMFv9SxPis9Xe8CvMgslF6T-1YIwk/edit" target="_blank" rel="noopener">DATA</a>
</div>
<p class="mu">ถ้ากรอบด้านล่างว่างหรือขอให้ล็อกอิน ให้กดปุ่ม "เปิดแดชบอร์ด" แทน</p>
<iframe src="https://script.google.com/macros/s/AKfycbzPZrGOin1o1HVcz9u16AIO8Kgrtj7wzTMTb6gJJ9khD8Ldt6fK1Aq6fcMljg_lHHcI/exec" title="แดชบอร์ดต้นทุนและกำไรหินทราย" loading="lazy"></iframe>
</body>
</html>
